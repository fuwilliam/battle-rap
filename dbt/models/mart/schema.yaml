version: 2

models:
  - name: elo
    description: "Blended Elo rating across casual head-to-head votes (K=16) and bracket matches (K=32). Backs the sortable Elo column on /ranking."
    columns:
      - name: artist_id
        description: "Spotify's artist_id identifier"
        tests:
          - unique
          - not_null
      - name: elo_rating
        description: "Elo rating after every recorded match (casual + bracket), starting from 1500"
        tests:
          - not_null
      - name: games_played
        description: "Total matches (casual + bracket) this artist has been in"
        tests:
          - not_null

  - name: elo_daily
    description: >
      Daily Elo checkpoints -- the full rating vector at the close of each day
      that had matches. Lets mart.elo replay only today instead of all history;
      also serves as the Elo-over-time series. Append-only: the current day is
      excluded until it closes. Caches formula output, so changing K factors or
      macros/elo_update.sql requires `dbt run --full-refresh -s mart.elo_daily+`.
    columns:
      - name: as_of_date
        description: "The closed day this vector is the state as of. Always < current_date."
        tests:
          - not_null
      - name: artist_id
        description: "Spotify's artist_id identifier"
        tests:
          - not_null
      - name: elo_rating
        description: "This artist's Elo after every match up to and including as_of_date"
        tests:
          - not_null

  - name: rappers
    description: "Contains artists' Spotify data (monthly_listeners, followers, world_rank, seeds)"
    columns:
      - name: artist_id
        description: "Spotify's artist_id identifier"
        tests:
          - unique
          - not_null
      - name: artist_name
        description: "The artist's name"
        tests:
          - not_null
      - name: monthly_listeners
        description: "Artist's Spotify monthly listener count (replaces the old 0-100 popularity). Nullable at this layer."
      - name: followers
        description: "Artist's follower count"
        tests:
          - not_null
      - name: world_rank
        description: "Artist's global Spotify rank (0 if outside the tracked top set)"
      - name: seeds
        description: "Comma-separated discovery seeds (genres/playlists) that surfaced the artist"
      - name: flag_core_genre
        description: "True if the artist was surfaced by a core hip-hop seed"
        tests:
          - not_null
      - name: image_url
        description: "URL for the artist's profile picture on Spotify"
      - name: first_seen_at
        description: "load_date of the earliest run that ingested this artist"
        tests:
          - not_null
      - name: last_seen_at
        description: "load_date of the most recent run that ingested this artist. Stale rows survive here on purpose; rappers_filtered is where they're retired."
        tests:
          - not_null

  - name: top_tracks
    description: "Contains up to top 10 tracks associated with given artist"
    columns:
      - name: artist_id
        description: "Spotify's artist_id identifier"
        tests:
          - not_null
          - relationships:
              to: ref('rappers')
              field: artist_id
      - name: track_rank
        description: "Rank for the track. A record with track_rank = 2 means it is the artist's second top track."
        tests:
          - not_null
      - name: track_name
        description: "The track (song) name"
        tests:
          - not_null
      - name: track_id
        description: "Spotify's track_id identifier"
        tests:
          - not_null
      - name: track_url
        description: "URL to play the track on Spotify"
        tests:
          - not_null
      - name: playcount
        description: "Spotify play count for the track"
      - name: last_seen_at
        description: "load_date of the run this track set came from"
        tests:
          - not_null

  - name: rappers_filtered
    description: >
      Artists eligible for battles: core-genre seed, monthly_listeners > 1M,
      followers > 100k, and seen by ingestion within the last 14 days. The
      staleness window is the resilience knob -- one failed scrape no longer
      pulls an artist out of the pool, a genuine delisting still clears within
      two weeks.
    columns:
      - name: artist_id
        description: "Spotify's artist_id identifier"
        tests:
          - unique
          - not_null
      - name: artist_name
        description: "The artist's name"
        tests:
          - not_null
      - name: monthly_listeners
        description: "Artist's Spotify monthly listener count"
        tests:
          - not_null
      - name: followers
        description: "Artist's follower count"
        tests:
          - not_null
      - name: world_rank
        description: "Artist's global Spotify rank (0 if outside the tracked top set)"
      - name: seeds
        description: "Comma-separated discovery seeds that surfaced the artist"
      - name: image_url
        description: "URL for the artist's profile picture on Spotify"
      - name: first_seen_at
        description: "load_date of the earliest run that ingested this artist"
        tests:
          - not_null
      - name: last_seen_at
        description: "load_date of the most recent run that ingested this artist. Always within the 14-day staleness window at this layer."
        tests:
          - not_null

  - name: ranking_live
    description: >
      Live head-to-head leaderboard backing /ranking. A view over raw.results,
      so votes are reflected immediately rather than at the next dbt run --
      elo_rating is the one run-bound column. Callers sort explicitly; the view
      has no ORDER BY.
    columns:
      - name: artist_id
        description: "Spotify's artist_id identifier"
        tests:
          - unique
          - not_null
      - name: artist_name
        description: "The artist's name"
        tests:
          - not_null
      - name: monthly_listeners
        description: "Artist's Spotify monthly listener count"
      - name: image_url
        description: "URL for the artist's profile picture on Spotify"
      - name: wins
        description: "Sum of head-to-head matchups won by artist"
        tests:
          - not_null
      - name: losses
        description: "Sum of head-to-head matchups lost by artist"
        tests:
          - not_null
      - name: win_rate
        description: "Wins divided by (wins+losses); never null given the >= 5 match floor"
        tests:
          - not_null
      - name: elo_rating
        description: "Blended Elo from mart.elo, defaulting to 1500 for artists with no rating yet"
        tests:
          - not_null

  - name: bracket_ranking_live
    description: >
      Live bracket leaderboard backing /ranking's bracket table. A view over
      raw.bracket_results. Rounds are identified by matches_in_round: 1 is the
      Final, 2 the semifinals (both semifinalists count as a Final Four
      appearance). Callers sort explicitly; the view has no ORDER BY.
    columns:
      - name: artist_id
        description: "Spotify's artist_id identifier"
        tests:
          - unique
          - not_null
      - name: artist_name
        description: "The artist's name"
        tests:
          - not_null
      - name: monthly_listeners
        description: "Artist's Spotify monthly listener count"
      - name: image_url
        description: "URL for the artist's profile picture on Spotify"
      - name: championships
        description: "Bracket runs won outright (winner of the matches_in_round = 1 Final)"
        tests:
          - not_null
      - name: final_fours
        description: "Semifinal appearances (either side of a matches_in_round = 2 match)"
        tests:
          - not_null
      - name: wins
        description: "Sum of bracket matches won by artist"
        tests:
          - not_null
      - name: losses
        description: "Sum of bracket matches lost by artist"
        tests:
          - not_null
      - name: win_rate
        description: "Wins divided by (wins+losses); never null given the > 0 match floor"
        tests:
          - not_null
      - name: elo_rating
        description: "Blended Elo from mart.elo, defaulting to 1500 for artists with no rating yet"
        tests:
          - not_null
