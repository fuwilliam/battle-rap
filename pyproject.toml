[project]
name = "battle-rap"
version = "0.1.0"
description = "Spotify -> MotherDuck rapper data pipeline (spotapi ingestion + dbt-duckdb)"
requires-python = ">=3.12"
dependencies = [
    "spotapi",
    # spotapi imports these storage backends at load time but doesn't declare them
    "pymongo",
    "redis",
    "websockets",
    # MotherDuck / DuckDB
    "duckdb",
    "dbt-duckdb",
    # data handling
    "python-dotenv",
    "pyarrow>=25.0.0",
]

[tool.uv]
# this is an application, not a library -- don't try to build/install the repo
package = false

[dependency-groups]
# SQL linting only -- the daily pipeline installs with `uv sync --no-dev`.
# sqlfluff-templater-dbt lets sqlfluff compile the project so ref()/source()/
# macros/{% snapshot %} resolve; config lives in .sqlfluff at the repo root.
dev = [
    "sqlfluff>=4.2.2",
    "sqlfluff-templater-dbt>=4.2.2",
]
